services:
  db:
    image: postgres:16-alpine
    container_name: stylesense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stylesense
    ports:
      - '5432:5432'
    volumes:
      - stylesense_pgdata:/var/lib/postgresql/data

volumes:
  stylesense_pgdata:
